<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Vehicle Request</title>

    <link rel="stylesheet" href="../stylesheet/driverRstyle.css">
</head>
<body>

    <button id="navToggle">
        <img src="../assits/toggle.png" alt="Menu">
    </button>

    <nav id="navbar">
        <h2>VEHICLE MOTORPOOL</h2>
        <a href="main.html">Dashboard</a>
        <a href="viewVehicles.html">View Vehicles</a>
        <a href="#">View Trips</a>
        <a href="#">Maintenance</a>
        <a href="driverRequest.html" class="active">Driver Requests</a>
    </nav>

    <main class="request-page">

        <header class="request-header">
            <h2>Request a Vehicle</h2>
            <p>Enter your trip details to request a vehicle.</p>
        </header>

        <form id="vehicleRequestForm">

            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination"
                    placeholder="Enter destination" required>
            </div>

            <div class="form-group">
                <label for="purpose">Purpose of Trip</label>
                <textarea id="purpose"
                    placeholder="Explain the purpose of your trip"
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="vehicleType">Vehicle Type</label>
                <select id="vehicleType" required>
                    <option value="">Choose vehicle type</option>
                    <option value="Sedan">Sedan</option>
                    <option value="SUV">SUV</option>
                    <option value="Van">Van</option>
                    <option value="Pickup">Pickup</option>
                    <option value="Truck">Truck</option>
                </select>
            </div>

            <div class="date-time-grid">

                <div class="form-group">
                    <label for="departureDate">Departure Date</label>
                    <input type="date" id="departureDate" required>
                </div>

                <div class="form-group">
                    <label for="departureTime">Departure Time</label>
                    <input type="time" id="departureTime" required>
                </div>

                <div class="form-group">
                    <label for="returnDate">Return Date</label>
                    <input type="date" id="returnDate" required>
                </div>

                <div class="form-group">
                    <label for="returnTime">Return Time</label>
                    <input type="time" id="returnTime" required>
                </div>

            </div>

            <div class="form-buttons">
                <button type="reset" class="clear-button">Clear</button>
                <button type="submit" class="submit-button">
                    Submit Request
                </button>
            </div>

        </form>

    </main>

    <script src="../scripts/driverRequest.js"></script>

</body>
</html>
