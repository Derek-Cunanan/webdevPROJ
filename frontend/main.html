<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Motorpool System</title>
    <link rel="stylesheet" href="../stylesheet/main.css">
    <link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet">
</head>
<body>

    <button id="navToggle">
        <img src="../assits/menu_24dp_000000_FILL0_wght400_GRAD0_opsz24 (1).svg" alt="">
    </button>

    <nav id="navbar" class="open">
        <h2>VEHICLE MOTORPOOL</h2>
        <a href="main.html" class="active">Dashboard</a>
        <a href="viewVehicles.html">View Vehicles</a>
        <a href="viewTrips.html">View Trips</a>
        <a href="maintenance.html">Maintenance</a>
    </nav>

    <main class="content">
        <div class="cards">
            <div class="card">
                <div>
                    <p class="cardLabel">Available Vehicles: </p>
                    <p class="cardNum">0</p>
                </div>

            </div>
            <div class="card">
                <div>
                    <p class="cardLabel">In use: </p>
                    <p class="cardNum">0</p>
                </div>
            </div>
            <div class="card">
                <div>
                    <p class="cardLabel">Under Maintenance: </p>
                    <p class="cardNum">0</p>
                </div>
            </div>
            <div class="card">
                <div>
                    <p class="cardLabel">Pending request: </p>
                    <p class="cardNum">0</p>
                </div>
            </div>
        </div>
        <div class="tableRequest">
            <div>
            <table>
                <thead>
                    <tr id="theaderRow">
                        <th id="firstChild">Vechicle</th>
                        <th>Driver</th>
                        <th>Status</th>
                        <th id="lastChild">Destination</th>
                    </tr>
                </thead>
                    <tbody>
                        <tr>
                            <td>ASDD</td>
                            <td>ASD</td>
                            <td>ASD</td>
                            <td>ASD</td>
                        </tr>
                        <tr>
                            <td>ASDD</td>
                            <td>ASD</td>
                            <td>ASD</td>
                            <td>ASD</td>
                        </tr>
                    </tbody>
                </table>
                <div class="chart">

                </div>
            </div>
            <aside class="requestContainer">
                <p id="requestHeader">Pending Request</p>
                <div class="request">
                    <p class="requestTitle">[driver]-[vehicle]</p>
                    <p class="requestPurpose">[purpose]-[date]</p>
                    <div>
                        <button class="requestAcceptBtn">Accept</button>
                        <button class="requestRejectBtn">Reject</button>
                    </div>
                </div>
            </aside>
        </div>

    </main>

    <script>
        const toggle = document.getElementById("navToggle");
        const navbar = document.getElementById("navbar");
        toggle.addEventListener("click", () => navbar.classList.toggle("open"));
    </script>
</body>
</html>
